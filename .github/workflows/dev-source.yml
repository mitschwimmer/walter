name: Temporary source archive for Rod implementation
on:
  push:
    branches: [test/scenario-visual-rod]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snapshot
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rod-source-snapshot
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
