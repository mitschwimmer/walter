name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check pinned package and Go tests
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Check development shell and race detector
        run: |
          nix develop -c go test -race ./...
          nix develop -c go -C tests/browser test ./... -timeout 6m
      - name: Verify daemonless ko OCI packaging
        run: |
          export KO_DOCKER_REPO=ko.local/walter
          nix develop -c ko build --bare --push=false --image-user=65532:65532 --oci-layout-path="$RUNNER_TEMP/walter-oci" .
          python3 - "$RUNNER_TEMP/walter-oci" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          def blob(ref):
              algorithm, digest = ref["digest"].split(":", 1)
              return json.loads((root / "blobs" / algorithm / digest).read_text())
          def configs(index):
              for ref in index["manifests"]:
                  doc = blob(ref)
                  if "manifests" in doc:
                      yield from configs(doc)
                  elif "config" in doc:
                      yield blob(doc["config"])
          images = [x for x in configs(json.loads((root / "index.json").read_text())) if x.get("os") == "linux" and x.get("architecture") == "amd64"]
          assert len(images) == 1, "expected one linux/amd64 application image"
          config = images[0]["config"]
          assert config["User"] == "65532:65532", config["User"]
          assert config["Entrypoint"] == ["/ko-app/walter"], config["Entrypoint"]
          PY
      - name: Check Nix formatting
        run: |
          nix fmt -- flake.nix
          git diff --exit-code -- flake.nix
