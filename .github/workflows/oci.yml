name: Test and publish Walter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.3'
          cache: true
      - name: Test and compile
        run: |
          node tests/sse.test.mjs
          go mod verify
          go test ./...
          go vet ./...
          mkdir -p dist/out dist/etc/ssl/certs dist/data
          chmod 0700 dist/data
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o dist/out/walter .
          cp /etc/ssl/certs/ca-certificates.crt dist/etc/ssl/certs/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image tags
        id: tags
        env:
          WALTER_REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${WALTER_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "$image:latest"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:$GITHUB_REF_NAME"
            fi
            echo EOF
            echo "repository=${WALTER_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      # A named context replaces the build stage with the tested host output.
      # Plain `docker build .` still builds/tests from source using that stage.
      - name: Package and publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-contexts: build=./dist
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: false
      - name: Record published digest
        if: github.event_name != 'pull_request'
        env:
          WALTER_DIGEST: ${{ steps.image.outputs.digest }}
          WALTER_REPOSITORY: ${{ steps.tags.outputs.repository }}
        run: |
          jq -n --arg repository "$WALTER_REPOSITORY" \
            --arg digest "$WALTER_DIGEST" --arg revision "$GITHUB_SHA" \
            --arg publication "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository: $repository, digest: $digest, revision: $revision, platform: "linux/amd64", publication: $publication}' \
            > image.lock.json
          {
            echo '### Walter OCI image'
            echo
            echo "Install by digest: \`ghcr.io/$WALTER_REPOSITORY@$WALTER_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish digest record
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: walter-image
          path: image.lock.json
          if-no-files-found: error
          retention-days: 30
      - name: Logout of GHCR
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io
