# Non-root distroless runtime with public CA certificates; update by digest.
defaultBaseImage: gcr.io/distroless/static-debian12:nonroot@sha256:d093aa3e30dbadd3efe1310db061a14da60299baff8450a17fe0ccc514a16639
defaultPlatforms:
  - linux/amd64
defaultEnv:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=local
defaultFlags:
  - -trimpath
  - -buildvcs=false
defaultLdflags:
  - -s
  - -w
  - -X main.revision={{.Git.FullCommit}}
  - -X main.defaultListen=0.0.0.0:8080
  - -X main.defaultDataDir=/data
