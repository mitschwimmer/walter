name: Visual scenarios

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walter-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check out the exact main commit. The candidate test harness renders both revisions.
      - name: Check out PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-base
          persist-credentials: false

      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/walter-ui-tools" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/walter-ui-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test and capture candidate scenarios
        env:
          WALTER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/walter-ui-tools/node_modules/playwright
        run: node tests/scenarios.mjs --out "$RUNNER_TEMP/walter-visual/candidate" --revision "$GITHUB_SHA"

      - name: Verify that identical captures compare unchanged
        run: |
          node tests/compare-scenarios.mjs \
            --base "$RUNNER_TEMP/walter-visual/candidate" \
            --candidate "$RUNNER_TEMP/walter-visual/candidate" \
            --base-defs "$GITHUB_WORKSPACE/tests/scenarios" \
            --candidate-defs "$GITHUB_WORKSPACE/tests/scenarios" \
            --out "$RUNNER_TEMP/walter-self-check"
          node -e "const a=require(process.argv[1]); const b=require(process.argv[2]); if(a.counts.unchanged !== b.images.length || Object.entries(a.counts).some(([k,v]) => k !== 'unchanged' && v)) process.exit(1)" \
            "$RUNNER_TEMP/walter-self-check/summary.json" \
            "$RUNNER_TEMP/walter-visual/candidate/manifest.json"

      - name: Capture comparable main scenarios
        if: github.event_name == 'pull_request'
        env:
          WALTER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/walter-ui-tools/node_modules/playwright
          MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node tests/scenarios.mjs \
            --web-root "$GITHUB_WORKSPACE/.visual-base/web" \
            --baseline-contracts "$GITHUB_WORKSPACE/.visual-base/tests/scenarios" \
            --revision "$MAIN_SHA" \
            --out "$RUNNER_TEMP/walter-visual/main"

      - name: Produce changed-only PR review
        if: github.event_name == 'pull_request'
        run: |
          node tests/compare-scenarios.mjs \
            --base "$RUNNER_TEMP/walter-visual/main" \
            --candidate "$RUNNER_TEMP/walter-visual/candidate" \
            --base-defs "$GITHUB_WORKSPACE/.visual-base/tests/scenarios" \
            --candidate-defs "$GITHUB_WORKSPACE/tests/scenarios" \
            --out "$RUNNER_TEMP/walter-visual/report"

      - name: Save browser captures and visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: walter-visual-scenarios
          path: ${{ runner.temp }}/walter-visual
          if-no-files-found: warn
          retention-days: 7
