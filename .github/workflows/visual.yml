name: Visual scenarios (Archaic Go)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walter-visual-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WALTER_BROWSER_NO_SANDBOX: '1' # CI only; local Chromium stays sandboxed
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          path: .visual-base
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.3'
          cache: true
          cache-dependency-path: tests/browser/go.sum
      - name: Locate Chrome
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          echo "WALTER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Verify Go-native browser regressions
        run: |
          go -C tests/browser mod tidy
          go -C tests/browser mod verify
          go -C tests/browser test ./... -v -timeout 6m
          go -C tests/browser vet ./...
      - name: Capture scenarios and compare main
        env:
          BASE_ROOT: ${{ github.workspace }}/.visual-base
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            go -C tests/browser run . capture --out "$RUNNER_TEMP/walter-visual/candidate" --revision "$GITHUB_SHA" --base-root "$BASE_ROOT"
          else
            go -C tests/browser run . capture --out "$RUNNER_TEMP/walter-visual/candidate" --revision "$GITHUB_SHA"
          fi
      - name: Verify identical images compare unchanged
        run: |
          go -C tests/browser run . compare \
            --base "$RUNNER_TEMP/walter-visual/candidate" \
            --candidate "$RUNNER_TEMP/walter-visual/candidate" \
            --out "$RUNNER_TEMP/walter-visual/self-check"
          jq -e --slurpfile m "$RUNNER_TEMP/walter-visual/candidate/manifest.json" \
            '.counts.unchanged == ($m[0].images | length) and .counts.changed == 0 and .counts.added == 0 and .counts.removed == 0 and .counts["contract-changed"] == 0' \
            "$RUNNER_TEMP/walter-visual/self-check/summary.json"
      - name: Save captures, reports and dependency checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: walter-go-visual-scenarios
          path: |
            ${{ runner.temp }}/walter-visual
            tests/browser/go.sum
          if-no-files-found: warn
          retention-days: 7
